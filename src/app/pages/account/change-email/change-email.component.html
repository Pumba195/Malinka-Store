<div class="verify-container">
  <div class="verify-card">
    <h1>Confirm <span>New Email</span></h1>

    <div class="verify-info">
      <p>We sent a 6-digit verification code to your new email address:</p>
      <p class="verify-email-text"><strong>{{ email }}</strong></p>
    </div>

    <div class="form-group">
      <h4>Verification Code</h4>
      <input 
        class="input-field" 
        type="text" 
        [(ngModel)]="code" 
        placeholder="000000" 
        maxlength="6"
        (keyup.enter)="onVerify()"
      >
    </div>

    @if (errorMessage) {
      <p class="error-text">{{ errorMessage }}</p>
    }

    <div class="actions">
      <button class="btn verify-btn" (click)="onVerify()" [disabled]="code.length < 6">
        Verify & Update Email
      </button>

      <div class="footer-links">
        <a (click)="resendCode()" class="link">Resend Code</a>
        <a routerLink="/profile/settings" class="link">Back to Settings</a>
      </div>
    </div>
  </div>
</div>
