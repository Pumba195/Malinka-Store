@if (user()) {
@if (router.url === '/profile') {
<main class="profile-container">

  <div class="profile-card">
    <h1>Welcome to your <span>Profile</span></h1>

    <div class="user-info">  
      <p class="label">Name</p>
      <p class="value">{{ user().name }}</p>

      <p class="label">Email address</p>
      <p class="value">{{ user().email }}</p>
    </div>

    <div class="profile-actions">
      <div class="buttons-flex">
        <button routerLink="/profile/orders" class="orders-btn btn">Order History</button>
        <button routerLink="/profile/settings" class="settings-btn btn">Edit Profile</button>
      </div>

      <button class="logout-btn btn" (click)="onLogout()">Logout</button>
    </div>
  </div>
</main>
}
<router-outlet></router-outlet>

} @else {
<main class="profile-container">
  <div class="guest-card">
    <p>Please, log in to see your profile.</p>
    <button routerLink="/login" class="login-link btn">Go to Login</button>
  </div>
</main>
}
